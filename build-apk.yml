name: Build KG Traders APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project (if the zip was uploaded as a file)
        run: |
          if [ ! -f package.json ]; then
            unzip -oq KG-Traders-Project.zip
          fi
          ls

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate app icon and splash
        run: npx capacitor-assets generate --android --assetPath resources
        continue-on-error: true

      - name: Add WhatsApp bridge (AndroidWA)
        run: cp android-patch/MainActivity.java android/app/src/main/java/com/kgtraders/app/MainActivity.java

      - name: Copy web files into Android
        run: npx cap sync android

      - name: Set app version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"3.1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Use fixed signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/KG-Traders.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: KG-Traders-APK
          path: out/KG-Traders.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: KG Traders build ${{ github.run_number }}
          files: out/KG-Traders.apk
